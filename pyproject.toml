[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-akaikkr"
version = "0.3.0"
description = "AiiDA plugin for AkaiKKR (specx)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Hiori Kino" }]
requires-python = ">=3.9"
dependencies = [
    "aiida-core>=2.0",
    "pyakaikkr",
    "numpy",
    "pymatgen",
    "ase",
]

[project.entry-points."aiida.calculations"]
"akaikkr.basic" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_basic"
"akaikkr.go" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_go"
"akaikkr.dos" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_dos"
"akaikkr.jij" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_jij"
"akaikkr.tc" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_tc"
"akaikkr.spc" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_spc"
"akaikkr.fsm" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_fsm"
"akaikkr.cnd" = "aiida_akaikkr.calculations.akaikkr_calcjob:specx_cnd"

[project.entry-points."aiida.parsers"]
"akaikkr.parser" = "aiida_akaikkr.parsers.akaikkr_parser:specx_parser"

[project.entry-points."aiida.workflows"]
"akaikkr.chain" = "aiida_akaikkr.workflows.chain:AkaikkrChainWorkChain"
"akaikkr.gaes" = "aiida_akaikkr.workflows.gaes:AkaikkrGaesWorkChain"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
plot = ["matplotlib"]
test = ["pytest"]

[project.scripts]
akaikkr-aiida = "aiida_akaikkr.cli.main:main"
akaikkr-mcp = "aiida_akaikkr.mcp.server:main"

[tool.setuptools.packages.find]
include = ["aiida_akaikkr*"]
